site_name: LicitaFinder
site_description: Documentação do LicitaFinder — análise de licitações públicas.
site_url: https://docs.licitafinder.com.br
use_directory_urls: false
repo_url: https://github.com/niyjn/licita-demo
repo_name: niyjn/licita-demo
edit_uri: edit/main/docs/
copyright: LicitaFinder

theme:
  name: material
  language: pt-BR
  font: false
  favicon: https://licitafinder.com.br/design-system/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Usar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Usar modo claro

extra:
  homepage: https://licitafinder.com.br/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/niyjn/licita-demo

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

nav:
  - Início: index.md
  - Primeiros passos: getting-started.md
  - Como funciona: how-it-works.md
  - Análises: analyses.md
  - Workers: workers.md
  - Sessões anônimas: anonymous-sessions.md
  - Fontes e limitações: data-sources.md
  - Privacidade: privacy.md
  - Arquitetura AWS: aws-architecture.md
  - Operação: operations.md
  - Contribuição: contributing.md
