services:
  postgres:
    image: postgres:16-alpine
    container_name: licitacoes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licitacoes}
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pncp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d ${POSTGRES_DB:-licitacoes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pncp-query:
    build: .
    container_name: pncp_query_app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-licitacoes}
      FAILURE_WEBHOOK_URL: ${FAILURE_WEBHOOK_URL:-}
      FAILURE_WEBHOOK_TIMEOUT_SECONDS: ${FAILURE_WEBHOOK_TIMEOUT_SECONDS:-10}
      PDF_RETENTION_DAYS: ${PDF_RETENTION_DAYS:-30}
      RUN_LIMIT_MIN: ${RUN_LIMIT_MIN:-30}
      RUN_LIMIT_DEFAULT: ${RUN_LIMIT_DEFAULT:-50}
      RUN_LIMIT_MAX: ${RUN_LIMIT_MAX:-200}
      ENABLE_DB_CHECKPOINT: ${ENABLE_DB_CHECKPOINT:-true}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-5}
      HTTP_BACKOFF_BASE_SECONDS: ${HTTP_BACKOFF_BASE_SECONDS:-2}
      HTTP_BACKOFF_MAX_SECONDS: ${HTTP_BACKOFF_MAX_SECONDS:-120}
      HTTP_JITTER_SECONDS: ${HTTP_JITTER_SECONDS:-1}
      OCR_DPI: ${OCR_DPI:-180}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
      PDF_TEXT_MAX_PAGES: ${PDF_TEXT_MAX_PAGES:-0}
      PDF_TEXT_TIMEOUT_SECONDS: ${PDF_TEXT_TIMEOUT_SECONDS:-180}
    volumes:
      - pncp_pdfs:/app/output/pdfs
    healthcheck:
      test: ["CMD", "python", "-m", "pncp_query.services.runtime_checks"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pncp_postgres_data:
  pncp_pdfs:
