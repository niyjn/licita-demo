services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: licita
      POSTGRES_USER: licita
      POSTGRES_PASSWORD: licita
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licita -d licita"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    image: licita-demo:latest
    command: ["alembic", "upgrade", "head"]
    environment: &app_environment
      DATABASE_URL: postgresql://licita:licita@postgres:5432/licita
      APP_VERSION: ${APP_VERSION:-dev}
      PDF_DIR: /app/output/pdfs
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    image: licita-demo:latest
    command: ["gunicorn", "-b", "0.0.0.0:8000", "--workers", "1", "--threads", "4", "app:app"]
    ports:
      - "8000:8000"
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: licita-demo:latest
    command: ["python", "-m", "pncp_query.worker"]
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
