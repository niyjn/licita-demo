<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Análise PNCP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
    <script>
      // Aplica o tema imediatamente antes de renderizar para evitar flash de luz
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-topbar">
        <div class="brand">
          <div class="brand-mark">PN</div>
          <div>
            <strong>Análise PNCP</strong>
            <span>Vencedores e perdedores por edital</span>
          </div>
        </div>
        <div class="topbar-actions" style="padding-bottom: 14px;">
          <button id="theme-toggle" class="btn btn-secondary">
            <span id="theme-toggle-text">Modo Escuro</span>
          </button>
        </div>
      </header>
      <main class="conversation-frame">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script>
      const toggle = document.getElementById('theme-toggle');
      const text = document.getElementById('theme-toggle-text');
      
      function updateToggleUI(theme) {
        if (theme === 'dark') {
          text.textContent = 'Modo Claro';
        } else {
          text.textContent = 'Modo Escuro';
        }
      }
      
      const currentTheme = document.documentElement.getAttribute('data-theme');
      updateToggleUI(currentTheme);
      
      toggle.addEventListener('click', () => {
        const activeTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateToggleUI(newTheme);
      });
    </script>
  </body>
</html>
